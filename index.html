<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      %OG_*% yer tutucuları build sırasında `src/config/wedding.ts`'ten
      doldurulur (bkz. vite.config.ts → socialMeta eklentisi). Buradaki
      adresler MUTLAK olmak zorunda: Open Graph göreli yolu kabul etmez,
      göreli bırakılırsa WhatsApp/iMessage/X önizlemeyi hiç göstermez.
    -->

    <title>%OG_TITLE%</title>
    <meta name="description" content="%OG_DESC%" />
    <link rel="canonical" href="%OG_URL%" />

    <meta name="theme-color" content="#FAF7F2" />
    <meta name="color-scheme" content="light" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Open Graph — WhatsApp, iMessage, Telegram, Facebook, LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Ömer & Burcu" />
    <meta property="og:url" content="%OG_URL%" />
    <meta property="og:title" content="%OG_TITLE%" />
    <meta property="og:description" content="%OG_DESC%" />
    <meta property="og:image" content="%OG_IMAGE%" />
    <!-- WhatsApp yalnızca HTTPS üzerinden görsel çeker; secure_url onu açıkça belirtir. -->
    <meta property="og:image:secure_url" content="%OG_IMAGE%" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%OG_ALT%" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="%OG_TITLE%" />
    <meta name="twitter:description" content="%OG_DESC%" />
    <meta name="twitter:image" content="%OG_IMAGE%" />
    <meta name="twitter:image:alt" content="%OG_ALT%" />

    <!--
      Arama motorlarına kapalı: özel bir davetiye, Google sonuçlarında
      çıkmasını istemiyoruz. Önizleme botları (WhatsApp, Facebook, X) bu
      etiketi dikkate almadan OG verisini okur — paylaşım kartı çalışmaya
      devam eder.
    -->
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:3rem 1.5rem;font-family:Georgia,serif;color:#2B2724;background:#FAF7F2;min-height:100vh;text-align:center">
        <h1 style="font-weight:300;letter-spacing:.2em">ÖMER &amp; BURCU</h1>
        <p style="color:#6E655E">Davetiyeyi görüntülemek için JavaScript'i etkinleştirin.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
